spring.application.name=agrinexus-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/agrinexus_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
agrinexus.jwt.secret=${JWT_SECRET:}
agrinexus.jwt.expiration-ms=86400000
agrinexus.auth.reset-token-expiration-minutes=30
agrinexus.auth.expose-reset-token=false
# ================================================================
# COPERNICUS DATA SPACE - SENTINEL-2
# ================================================================

# Credentials are intentionally read from environment variables.
# NEVER commit the actual client secret to GitHub.

agrinexus.satellite.copernicus.client-id=${COPERNICUS_CLIENT_ID:}
agrinexus.satellite.copernicus.client-secret=${COPERNICUS_CLIENT_SECRET:}

agrinexus.satellite.copernicus.lookback-days=45

agrinexus.satellite.copernicus.max-cloud-cover=60

agrinexus.satellite.copernicus.aoi-half-size-degrees=0.002
# ================================================================
# AGRINEXUS - COPERNICUS CLMS LULC
# ================================================================

# Same OAuth credentials used by the Sentinel-2 module.
# Never hardcode the real secret here.

agrinexus.lulc.client-id=${COPERNICUS_CLIENT_ID:}
agrinexus.lulc.client-secret=${COPERNICUS_CLIENT_SECRET:}


# Copernicus CLMS
# Land Cover Map at 10m - Annual V1

agrinexus.lulc.collection-id=828f6b20-8ffd-48f8-a1da-fefd271456db


# Current documented global product base year

agrinexus.lulc.base-year=2020


# Analyze approximately 250 metres around the farm centre

agrinexus.lulc.aoi-radius-meters=250


# Product spatial resolution

agrinexus.lulc.spatial-resolution-meters=10
agrinexus.satellite.lulc.client-id=${COPERNICUS_CLIENT_ID:}
agrinexus.satellite.lulc.client-secret=${COPERNICUS_CLIENT_SECRET:}

agrinexus.satellite.lulc.identity-url=https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token

agrinexus.satellite.lulc.statistics-url=https://sh.dataspace.copernicus.eu/statistics/v1

agrinexus.satellite.lulc.collection-id=828f6b20-8ffd-48f8-a1da-fefd271456db

agrinexus.satellite.lulc.base-year=2020

agrinexus.satellite.lulc.aoi-radius-meters=250

agrinexus.satellite.lulc.spatial-resolution-meters=10
# ============================================================
# COPERNICUS SENTINEL-2 L2A
# ============================================================

copernicus.sentinel2.base-url=https://sh.dataspace.copernicus.eu
copernicus.sentinel2.collection=sentinel-2-l2a
copernicus.sentinel2.lookback-days=30
copernicus.sentinel2.max-cloud-coverage=30
copernicus.sentinel2.spatial-resolution-meters=10
copernicus.sentinel2.aoi-radius-meters=250
